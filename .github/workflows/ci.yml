name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: 'Movie Project/frontend'
        run: npm ci
      - name: Run tests
        working-directory: 'Movie Project/frontend'
        run: npm test -- --run
      - name: Build
        working-directory: 'Movie Project/frontend'
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 'Movie Project/frontend/dist'
