<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ticket-collage" aria-hidden="true">
        <span class="ticket ticket-1"></span>
        <span class="ticket ticket-2"></span>
        <span class="ticket ticket-3"></span>
        <span class="ticket ticket-4"></span>
        <span class="ticket ticket-5"></span>
        <span class="ticket ticket-6"></span>
    </div>

    <header class="site-header">
        <div class="container header-inner">
            <div class="brand-wrap">
                <div class="brand">Movie Masters</div>
            </div>
            <nav class="top-nav" aria-label="Main navigation">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Connect</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <section class="search-panel">
            <div class="hero-title-wrap">
                <h1>Movie Masters</h1>
            </div>
            <form id="searchForm" class="search-form">
                <div class="search-field-wrap">
                    <input id="searchInput" type="text" placeholder="Search for a movie, series, or title"
                        aria-label="Search titles" value="batman" autocomplete="off">
                    <div id="suggestions" class="suggestions" aria-live="polite"></div>
                </div>
                <button type="submit"><span>Search</span></button>
            </form>
        </section>

        <section>
            <p id="status" class="status">Loading demo results...</p>
            <div id="results" class="results-grid" aria-live="polite"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand-wrap">
                <div class="footer-brand">Movie Masters</div>
            </div>
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Connect</a>
                <a href="#">Contact</a>
            </div>
            <div class="copyright">© 2026 MovieMakersEntertainment</div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
